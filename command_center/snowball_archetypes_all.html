    <meta charset="UTF-8">

    <style>
    :root {
      --bg: #070709; --text: #f0f0f5; --text2: #888899; --text3: #444455;
      --border: rgba(255,255,255,0.06); --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono: ui-monospace,monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--sans); }
    
    /* NAV */
    .arch-nav {
      position:fixed; top:0; left:0; right:0; height:52px; z-index:100;
      background:rgba(7,7,9,0.95); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 24px; gap:0;
      backdrop-filter:blur(20px); overflow-x:auto;
    }
    .arch-nav::-webkit-scrollbar { display:none; }
    .arch-btn {
      font-size:10px; font-family:var(--mono); letter-spacing:0.08em;
      padding:8px 16px; border:none; background:transparent; color:var(--text3);
      cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
      transition:all 0.2s;
    }
    .arch-btn.active { color:var(--accent,#4a9eff); border-bottom-color:var(--accent,#4a9eff); }
    
    /* ARCHETYPE SECTIONS */
    .arch-section { display:none; min-height:100vh; padding:80px 40px 60px; }
    .arch-section.active { display:block; }
    
    /* COMPONENT DEMOS */
    .demo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin:24px 0; }
    .demo-block { padding:24px; border-radius:8px; border:1px solid var(--ab, rgba(255,255,255,0.06)); background:var(--ac, rgba(255,255,255,0.02)); }
    .demo-label { font-size:9px; font-family:var(--mono); letter-spacing:0.15em; color:var(--text3); margin-bottom:16px; text-transform:uppercase; }
    
    /* TOKEN EXPORT */
    .token-export {
      background:rgba(0,0,0,0.4); border-radius:6px; padding:16px;
      font-family:var(--mono); font-size:11px; color:#a8d8a8; line-height:1.8;
      margin:16px 0; overflow-x:auto; border:1px solid rgba(255,255,255,0.06);
    }
    .te-key { color:#88aacc; }
    .te-val { color:#ccaa88; }
    
    /* SECTION HEADERS */
    .arch-header {
      margin-bottom:40px; padding-bottom:32px;
      border-bottom:1px solid var(--border);
    }
    .arch-number { font-size:10px; font-family:var(--mono); color:var(--text3); letter-spacing:0.2em; margin-bottom:8px; }
    .arch-name-big { font-size:clamp(32px,5vw,64px); font-weight:900; line-height:1; letter-spacing:-0.02em; margin-bottom:12px; }
    .arch-tagline-big { font-size:16px; color:var(--text2); line-height:1.6; max-width:600px; margin-bottom:20px; }
    .arch-meta { display:flex; gap:16px; flex-wrap:wrap; }
    .arch-meta-item { font-size:10px; font-family:var(--mono); color:var(--text3); padding:4px 10px; border-radius:3px; border:1px solid var(--border); }
    
    .comp-section-title {
      font-size:11px; font-family:var(--mono); letter-spacing:0.15em;
      color:var(--text3); margin:32px 0 16px; text-transform:uppercase;
      border-bottom:1px solid var(--border); padding-bottom:8px;
    }
    </style>

    function renderArchetypes() {
      const nav = document.getElementById('arch-nav');
      const sections = document.getElementById('arch-sections');
    
      nav.innerHTML = `<span style="font-size:11px;font-weight:800;letter-spacing:0.1em;color:#f0f0f5;margin-right:16px;white-space:nowrap;">SNOWBALL ARCHETYPES</span>` +
        ARCHETYPES.map(a => `<button class="arch-btn" onclick="showArch('${a.id}',this)" style="--accent:${a.accent};">${a.n} ${a.name.split(' ')[0]}</button>`).join('');
    
      sections.innerHTML = ARCHETYPES.map(a => {
        const tokenLines = Object.entries(a.tokens).map(([k,v]) => `  <span class="te-key">${k}</span>: <span class="te-val">"${v}"</span>;`).join('\n');
        const components = a.components.map(c => `
          <div class="demo-block" style="background:${a.surface};border-color:${a.border};">
            <div class="demo-label">${c.name}</div>
            <div style="background:${a.bg};padding:16px;border-radius:4px;">${c.code}</div>
          </div>`).join('');
    
        const goodBad = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
            <div style="padding:16px;background:rgba(74,222,128,0.05);border:1px solid rgba(74,222,128,0.15);border-radius:5px;">
              <div style="font-size:9px;font-family:monospace;color:#4ade80;letter-spacing:0.1em;margin-bottom:8px;">COPY REGISTER — CORRECT</div>
              ${a.copyRegister.good.map(t=>`<div style="font-size:12px;color:#e8e8f0;padding:4px 0;font-family:monospace;">"${t}"</div>`).join('')}
            </div>
            <div style="padding:16px;background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.12);border-radius:5px;">
              <div style="font-size:9px;font-family:monospace;color:#f87171;letter-spacing:0.1em;margin-bottom:8px;">COPY REGISTER — WRONG</div>
              ${a.copyRegister.bad.map(t=>`<div style="font-size:12px;color:#888899;padding:4px 0;font-family:monospace;text-decoration:line-through;">"${t}"</div>`).join('')}
            </div>
          </div>`;
    
        const cssvars = `:root {\n${tokenLines}\n}`;
        const figmaJSON = JSON.stringify(Object.fromEntries(Object.entries(a.tokens).map(([k,v])=>[k.replace('--',''),{value:v,type:'other'}])),null,2);
        const nextjsExport = `export const ${a.id}Tokens = ${JSON.stringify(a.tokens,null,2)} as const;`;
    
        return `
        <div class="arch-section" id="arch-${a.id}" style="background:${a.bg};">
          <div class="arch-header">
            <div class="arch-number" style="color:${a.accent};">${a.n} · SNOWBALL ARCHETYPE</div>
            <div class="arch-name-big" style="color:${a.accent};">${a.name}</div>
            <div class="arch-tagline-big">${a.tagline}</div>
            <div class="arch-meta">
              <div class="arch-meta-item" style="border-color:${a.border};color:${a.accent};">accent: ${a.accent}</div>
              <div class="arch-meta-item" style="border-color:${a.border};">display: ${a.fonts.display}</div>
              <div class="arch-meta-item" style="border-color:${a.border};">body: ${a.fonts.body}</div>
              <div class="arch-meta-item" style="border-color:${a.border};">radius: ${a.tokens['--radius']}</div>
            </div>
          </div>
    
          <div class="comp-section-title" style="color:${a.accent};">COMPONENT LIBRARY</div>
          <div class="demo-grid">${components}</div>
    
          <div class="comp-section-title" style="color:${a.accent};">COPY REGISTER</div>
          ${goodBad}
    
          <div class="comp-section-title" style="color:${a.accent};">DESIGN TOKENS — CSS VARIABLES</div>
          <div class="token-export" style="background:rgba(0,0,0,0.5);">${cssvars}</div>
    
          <div class="comp-section-title" style="color:${a.accent};">FIGMA TOKEN JSON</div>
          <div class="token-export" style="background:rgba(0,0,0,0.5);">${figmaJSON.replace(/</g,'&lt;')}</div>
    
          <div class="comp-section-title" style="color:${a.accent};">NEXT.JS EXPORT</div>
          <div class="token-export" style="background:rgba(0,0,0,0.5);">${nextjsExport}</div>
        </div>`;
      }).join('');
    
      // Show first
      showArch('marcello', nav.querySelectorAll('.arch-btn')[0]);
    }
    
    function showArch(id, btn) {
      document.querySelectorAll('.arch-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.arch-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('arch-'+id).classList.add('active');
      if (btn) btn.classList.add('active');
      const arch = ARCHETYPES.find(a=>a.id===id);
      if (arch) document.documentElement.style.setProperty('--accent', arch.accent);
    }
    
    renderArchetypes();
    </script>
    </body>
    </html>
