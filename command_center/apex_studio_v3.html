<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX STUDIO V3 — Snowball Command Center</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
      }
    }
    </script>
    <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #0f0f17;
      --bg3: #14141f;
      --accent: #4a9eff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --amber: #f59e0b;
      --red: #f87171;
      --green: #4ade80;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --border-accent: rgba(74,158,255,0.6);
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --mono: ui-monospace, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --orb-color: #4a9eff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden; }
    
    /* ═══ LAYOUT ═══ */
    #app { display:grid; grid-template-rows:auto 1fr; grid-template-columns:280px 1fr 320px; height:100vh; gap:0; }
    #top-bar { grid-column:1/-1; height:48px; background:rgba(10,10,15,0.95); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:12px; z-index:100; backdrop-filter:blur(12px); }
    #left-panel { grid-row:2; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    #center-panel { grid-row:2; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    #right-panel { grid-row:2; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    
    /* ═══ TOP BAR ═══ */
    .top-logo { font-size:13px; font-weight:700; letter-spacing:0.15em; color:var(--accent); text-transform:uppercase; }
    .top-divider { width:1px; height:20px; background:var(--border); }
    .top-mode-pill { display:flex; gap:2px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:20px; padding:2px; }
    .mode-btn { padding:3px 10px; border-radius:16px; font-size:10px; font-weight:600; letter-spacing:0.08em; cursor:pointer; transition:all 0.2s; color:var(--text3); border:none; background:transparent; text-transform:uppercase; }
    .mode-btn.active { background:var(--accent); color:#fff; }
    .mode-btn.solo.active { background:var(--amber); color:#000; }
    .mode-btn.dark.active { background:#2a2a3a; color:var(--text2); }
    .top-status { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .status-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); }
    .status-dot.mock { background:var(--amber); box-shadow:0 0 6px var(--amber); }
    .mock-badge { font-size:9px; font-weight:700; letter-spacing:0.1em; color:var(--amber); border:1px solid rgba(245,158,11,0.3); border-radius:4px; padding:1px 5px; text-transform:uppercase; }
    .top-time { font-size:11px; color:var(--text3); font-family:var(--mono); }
    
    /* ═══ LEFT PANEL — NAV + MCP ═══ */
    .panel-header { padding:12px 16px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .panel-title { font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3); }
    .panel-action { font-size:10px; color:var(--accent); cursor:pointer; }
    
    #left-tabs { display:flex; border-bottom:1px solid var(--border); }
    .left-tab { flex:1; padding:8px 4px; font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3); cursor:pointer; text-align:center; border-bottom:2px solid transparent; transition:all 0.2s; }
    .left-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    
    .left-content { flex:1; overflow-y:auto; padding:8px; }
    .left-content::-webkit-scrollbar { width:3px; }
    .left-content::-webkit-scrollbar-track { background:transparent; }
    .left-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    
    /* MCP Items */
    .mcp-server { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:6px; cursor:pointer; transition:all 0.2s; }
    .mcp-server:hover { border-color:var(--border-accent); }
    .mcp-server.active { border-color:var(--accent); background:rgba(74,158,255,0.06); }
    .mcp-name { font-size:12px; font-weight:600; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:6px; }
    .mcp-meta { font-size:10px; color:var(--text3); font-family:var(--mono); }
    .mcp-tools { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
    .tool-chip { font-size:9px; padding:1px 5px; background:rgba(74,158,255,0.1); border:1px solid rgba(74,158,255,0.2); border-radius:3px; color:var(--accent); font-family:var(--mono); }
    
    /* CRM Items */
    .crm-contact { display:flex; align-items:center; gap:8px; padding:8px; border-radius:6px; cursor:pointer; transition:all 0.15s; }
    .crm-contact:hover { background:var(--card); }
    .crm-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
    .crm-info { flex:1; min-width:0; }
    .crm-name { font-size:12px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .crm-stage { font-size:10px; color:var(--text3); }
    .crm-signal { font-size:9px; padding:1px 5px; border-radius:3px; font-weight:600; }
    .crm-signal.hot { background:rgba(248,113,113,0.15); color:var(--red); }
    .crm-signal.warm { background:rgba(245,158,11,0.15); color:var(--amber); }
    .crm-signal.cool { background:rgba(74,158,255,0.1); color:var(--accent); }
    
    /* Skills */
    .skill-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:6px; }
    .skill-name { font-size:12px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
    .skill-mode { font-size:9px; padding:1px 6px; border-radius:3px; font-weight:700; letter-spacing:0.06em; }
    .skill-mode.live { background:rgba(16,185,129,0.15); color:var(--accent3); border:1px solid rgba(16,185,129,0.3); }
    .skill-mode.compiled { background:rgba(74,158,255,0.1); color:var(--accent); border:1px solid rgba(74,158,255,0.2); }
    .skill-mode.dormant { background:rgba(255,255,255,0.04); color:var(--text3); border:1px solid var(--border); }
    .skill-meta { font-size:10px; color:var(--text3); font-family:var(--mono); }
    
    /* ═══ CENTER — ORB + STREAM ═══ */
    #orb-zone { height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; position:relative; border-bottom:1px solid var(--border); background:radial-gradient(ellipse at 50% 0%, rgba(74,158,255,0.06) 0%, transparent 70%); }
    #orb-canvas { width:160px; height:160px; cursor:pointer; }
    #orb-label { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; }
    #orb-state-text { font-size:9px; color:var(--text3); font-family:var(--mono); letter-spacing:0.1em; text-transform:uppercase; }
    #conv-card { position:absolute; top:180px; left:50%; transform:translateX(-50%); width:340px; background:var(--bg3); border:1px solid var(--border-accent); border-radius:12px; padding:12px; z-index:50; display:none; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    #conv-input { width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:6px; padding:8px 10px; color:var(--text); font-size:13px; font-family:var(--sans); resize:none; height:36px; outline:none; transition:all 0.2s; }
    #conv-input:focus { border-color:var(--accent); height:72px; }
    .conv-hint { font-size:10px; color:var(--text3); margin-top:6px; }
    
    #center-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg2); flex-shrink:0; }
    .center-tab { padding:10px 16px; font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
    .center-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    
    .center-view { flex:1; overflow-y:auto; padding:12px; display:none; }
    .center-view.active { display:block; }
    .center-view::-webkit-scrollbar { width:3px; }
    .center-view::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    
    /* ═══ PROJECT STREAM ═══ */
    .project-card { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; margin-bottom:10px; overflow:hidden; transition:all 0.4s cubic-bezier(0.4,0,0.2,1); animation:slideUp 0.3s ease-out; }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .project-card.sinking { height:48px!important; }
    .project-card.amber { border-left-color:var(--amber); }
    .project-card.red { border-left-color:var(--red); }
    .project-card.done { border-left-color:var(--green); opacity:0.7; }
    .project-card.resurfaced { border-color:rgba(245,158,11,0.4); box-shadow:0 0 20px rgba(245,158,11,0.08); }
    .card-header { padding:12px 14px; display:flex; align-items:center; gap:8px; cursor:pointer; }
    .health-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .health-dot.green { background:var(--green); box-shadow:0 0 6px var(--green); }
    .health-dot.amber { background:var(--amber); box-shadow:0 0 6px var(--amber); }
    .health-dot.red { background:var(--red); box-shadow:0 0 6px var(--red); animation:pulse-red 1.5s infinite; }
    @keyframes pulse-red { 0%,100%{box-shadow:0 0 6px var(--red);} 50%{box-shadow:0 0 12px var(--red);} }
    .project-name { font-size:14px; font-weight:700; letter-spacing:0.02em; flex:1; }
    .weight-score { font-size:10px; color:var(--text3); font-family:var(--mono); }
    .status-badge { font-size:9px; padding:2px 6px; border-radius:4px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
    .badge-active { background:rgba(74,158,255,0.15); color:var(--accent); border:1px solid rgba(74,158,255,0.3); }
    .badge-done { background:rgba(74,222,128,0.1); color:var(--green); border:1px solid rgba(74,222,128,0.25); }
    .badge-alert { background:rgba(245,158,11,0.15); color:var(--amber); border:1px solid rgba(245,158,11,0.3); }
    .why-tag { font-size:9px; padding:1px 6px; border-radius:3px; background:rgba(245,158,11,0.1); color:var(--amber); border:1px solid rgba(245,158,11,0.25); font-family:var(--mono); }
    .card-body { padding:0 14px 12px; }
    .agent-chips { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
    .agent-chip { font-size:9px; padding:2px 7px; border-radius:10px; font-weight:600; border:1px solid; }
    .nested-updates { display:flex; flex-direction:column; gap:4px; }
    .update-mini { display:flex; align-items:center; gap:6px; padding:6px 8px; background:rgba(255,255,255,0.02); border-radius:6px; border-left:2px solid var(--accent2); }
    .update-text { font-size:11px; color:var(--text2); flex:1; }
    .update-time { font-size:9px; color:var(--text3); font-family:var(--mono); }
    .strip-card { height:48px; display:flex; align-items:center; padding:0 14px; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:6px; cursor:pointer; }
    .strip-name { font-size:12px; color:var(--text2); flex:1; }
    .strip-time { font-size:10px; color:var(--text3); font-family:var(--mono); }
    .alert-card { background:var(--card); border:1px solid rgba(245,158,11,0.4); border-left:3px solid var(--amber); border-radius:10px; padding:14px; margin-bottom:10px; }
    .alert-actions { display:flex; gap:6px; margin-top:10px; }
    .alert-btn { padding:4px 10px; border-radius:5px; font-size:10px; font-weight:600; cursor:pointer; border:1px solid; transition:all 0.2s; background:transparent; }
    .btn-dismiss { border-color:var(--border); color:var(--text3); }
    .btn-snooze { border-color:rgba(74,158,255,0.3); color:var(--accent); }
    .btn-act { border-color:rgba(74,158,255,0.6); color:var(--accent); background:rgba(74,158,255,0.1); }
    .btn-dismiss:hover { background:var(--card); }
    .btn-act:hover { background:rgba(74,158,255,0.2); }
    
    /* ═══ KANBAN ═══ */
    #kanban-view { display:none; }
    #kanban-view.active { display:flex; gap:10px; padding:12px; overflow-x:auto; height:100%; }
    .kanban-col { flex-shrink:0; width:240px; display:flex; flex-direction:column; gap:6px; }
    .kanban-header { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:8px 10px; border-radius:6px; display:flex; align-items:center; justify-content:space-between; }
    .kanban-header.backlog { background:rgba(255,255,255,0.03); color:var(--text3); }
    .kanban-header.progress { background:rgba(74,158,255,0.1); color:var(--accent); }
    .kanban-header.review { background:rgba(245,158,11,0.1); color:var(--amber); }
    .kanban-header.done { background:rgba(74,222,128,0.08); color:var(--green); }
    .kanban-header.blocked { background:rgba(248,113,113,0.1); color:var(--red); }
    .k-count { font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px; background:rgba(255,255,255,0.08); color:var(--text2); }
    .kanban-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px; cursor:grab; transition:all 0.2s; }
    .kanban-card:hover { border-color:var(--border-accent); transform:translateY(-1px); }
    .kanban-card.dragging { opacity:0.5; cursor:grabbing; }
    .k-title { font-size:12px; font-weight:600; color:var(--text); margin-bottom:6px; }
    .k-meta { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .k-tag { font-size:9px; padding:1px 5px; border-radius:3px; font-family:var(--mono); }
    .k-tag.agent { background:rgba(124,58,237,0.15); color:#a78bfa; border:1px solid rgba(124,58,237,0.25); }
    .k-tag.proj { background:rgba(74,158,255,0.1); color:var(--accent); border:1px solid rgba(74,158,255,0.2); }
    .k-assign { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; margin-left:auto; }
    .k-priority { width:6px; height:6px; border-radius:50%; }
    .k-priority.urgent { background:var(--red); }
    .k-priority.high { background:var(--amber); }
    .k-priority.normal { background:var(--accent); }
    
    /* ═══ MESSAGE BUS ═══ */
    .msg-bus { display:flex; flex-direction:column; height:100%; }
    .msg-stream { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
    .msg-stream::-webkit-scrollbar { width:3px; }
    .msg-stream::-webkit-scrollbar-thumb { background:var(--border); }
    .msg-item { display:flex; gap:8px; align-items:flex-start; animation:slideUp 0.2s ease-out; }
    .msg-avatar { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; flex-shrink:0; margin-top:2px; }
    .msg-bubble { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; flex:1; }
    .msg-from { font-size:10px; font-weight:700; color:var(--text2); margin-bottom:3px; display:flex; align-items:center; gap:4px; }
    .msg-text { font-size:12px; color:var(--text); line-height:1.5; }
    .msg-time { font-size:9px; color:var(--text3); font-family:var(--mono); }
    .msg-type { font-size:8px; padding:1px 4px; border-radius:3px; text-transform:uppercase; letter-spacing:0.06em; }
    .msg-type.agent { background:rgba(124,58,237,0.2); color:#a78bfa; }
    .msg-type.health { background:rgba(74,222,128,0.1); color:var(--green); }
    .msg-type.alert { background:rgba(248,113,113,0.15); color:var(--red); }
    .msg-type.system { background:rgba(255,255,255,0.06); color:var(--text3); }
    .msg-input-row { padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:6px; }
    .msg-input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 10px; color:var(--text); font-size:12px; outline:none; font-family:var(--sans); }
    .msg-input:focus { border-color:var(--border-accent); }
    .msg-send { padding:6px 12px; background:var(--accent); border:none; border-radius:6px; color:#fff; font-size:11px; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .msg-send:hover { opacity:0.85; }
    
    /* ═══ RIGHT PANEL ═══ */
    #right-tabs { display:flex; border-bottom:1px solid var(--border); }
    .right-tab { flex:1; padding:8px 4px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); cursor:pointer; text-align:center; border-bottom:2px solid transparent; transition:all 0.2s; }
    .right-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .right-content { flex:1; overflow-y:auto; padding:10px; }
    .right-content::-webkit-scrollbar { width:3px; }
    .right-content::-webkit-scrollbar-thumb { background:var(--border); }
    
    /* Agent status items */
    .agent-status { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:6px; }
    .agent-name { font-size:12px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
    .agent-running { width:6px; height:6px; border-radius:50%; background:var(--green); animation:blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .agent-idle { background:var(--text3)!important; animation:none!important; }
    .agent-task { font-size:11px; color:var(--text2); margin-bottom:4px; }
    .agent-metrics { display:flex; gap:8px; }
    .metric { font-size:10px; color:var(--text3); font-family:var(--mono); }
    .metric span { color:var(--text2); }
    
    /* Health feed */
    .health-item { display:flex; gap:8px; align-items:flex-start; padding:8px; border-radius:6px; margin-bottom:4px; background:var(--card); border:1px solid var(--border); }
    .health-icon { font-size:14px; flex-shrink:0; }
    .health-text { font-size:11px; color:var(--text2); line-height:1.4; }
    .health-proj { font-size:10px; color:var(--text3); margin-top:2px; font-family:var(--mono); }
    
    /* Preference profile */
    .pref-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
    .pref-label { font-size:11px; color:var(--text2); }
    .pref-val { font-size:11px; color:var(--accent); font-family:var(--mono); }
    .hour-bar { display:flex; gap:1px; margin-top:8px; }
    .hour-cell { flex:1; height:20px; border-radius:2px; transition:all 0.3s; }
    
    /* Skill registry overlay */
    #skill-overlay { position:fixed; right:-360px; top:0; width:360px; height:100vh; background:var(--bg2); border-left:1px solid var(--border); z-index:200; transition:right 0.3s cubic-bezier(0.4,0,0.2,1); padding:16px; overflow-y:auto; }
    #skill-overlay.open { right:0; }
    #skill-overlay::-webkit-scrollbar { width:3px; }
    #skill-overlay::-webkit-scrollbar-thumb { background:var(--border); }
    .overlay-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .overlay-title { font-size:14px; font-weight:700; color:var(--text); }
    .overlay-close { font-size:18px; color:var(--text3); cursor:pointer; line-height:1; }
    .skill-url-input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:8px 10px; color:var(--text); font-size:12px; font-family:var(--mono); outline:none; margin-bottom:8px; }
    .skill-url-input:focus { border-color:var(--border-accent); }
    .skill-add-btn { width:100%; padding:8px; background:rgba(74,158,255,0.1); border:1px solid rgba(74,158,255,0.3); border-radius:6px; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s; margin-bottom:12px; }
    .skill-add-btn:hover { background:rgba(74,158,255,0.2); }
    
    /* MCP Inspector */
    .mcp-inspector { background:rgba(0,0,0,0.3); border-radius:8px; padding:10px; margin-top:8px; font-family:var(--mono); font-size:10px; color:var(--accent3); line-height:1.6; border:1px solid rgba(16,185,129,0.2); }
    .mcp-log-line { display:flex; gap:8px; }
    .mcp-ts { color:var(--text3); }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0,0,3.2);
    
    // Face group
    const faceGroup = new THREE.Group();
    scene.add(faceGroup);
    
    // Head — slightly oblate sphere
    const headGeo = new THREE.SphereGeometry(1, 64, 64);
    const headMat = new THREE.MeshPhongMaterial({
      color: 0x0a0a1a,
      emissive: 0x4a9eff,
      emissiveIntensity: 0.08,
      shininess: 40,
      transparent: true,
      opacity: 0.95
    });
    const head = new THREE.Mesh(headGeo, headMat);
    head.scale.z = 0.82;
    faceGroup.add(head);
    
    // Inner glow sphere
    const glowGeo = new THREE.SphereGeometry(0.92, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x4a9eff,
      transparent: true,
      opacity: 0.04,
      side: THREE.BackSide
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    faceGroup.add(glow);
    
    // Eyes
    function makeEye(xOff) {
      const group = new THREE.Group();
      // Sclera
      const scleraGeo = new THREE.SphereGeometry(0.14, 20, 20);
      const scleraMat = new THREE.MeshPhongMaterial({ color:0xd0e8ff, emissive:0x4a9eff, emissiveIntensity:0.2, shininess:80 });
      const sclera = new THREE.Mesh(scleraGeo, scleraMat);
      group.add(sclera);
      // Iris
      const irisGeo = new THREE.CircleGeometry(0.08, 24);
      const irisMat = new THREE.MeshBasicMaterial({ color:0x4a9eff });
      const iris = new THREE.Mesh(irisGeo, irisMat);
      iris.position.z = 0.141;
      group.add(iris);
      // Pupil
      const pupilGeo = new THREE.CircleGeometry(0.04, 16);
      const pupilMat = new THREE.MeshBasicMaterial({ color:0x000814 });
      const pupil = new THREE.Mesh(pupilGeo, pupilMat);
      pupil.position.z = 0.142;
      group.add(pupil);
      // Specular
      const specGeo = new THREE.CircleGeometry(0.015, 8);
      const specMat = new THREE.MeshBasicMaterial({ color:0xffffff });
      const spec = new THREE.Mesh(specGeo, specMat);
      spec.position.set(0.025, 0.025, 0.143);
      group.add(spec);
      // Eyelid
      const lidGeo = new THREE.SphereGeometry(0.145, 20, 20, 0, Math.PI*2, 0, Math.PI/2);
      const lidMat = new THREE.MeshPhongMaterial({ color:0x0a0a1a, emissive:0x4a9eff, emissiveIntensity:0.05, shininess:20 });
      const lid = new THREE.Mesh(lidGeo, lidMat);
      lid.rotation.x = Math.PI/2;
      lid.position.y = 0.01;
      group.add(lid);
    
      group.position.set(xOff, 0.18, 0.77);
      group.userData = { lid, sclera, iris, lidOpen:1 };
      return group;
    }
    const eyeL = makeEye(-0.28);
    const eyeR = makeEye(0.28);
    faceGroup.add(eyeL);
    faceGroup.add(eyeR);
    
    // Brows
    function makeBrow(xOff) {
      const geo = new THREE.CapsuleGeometry(0.025, 0.16, 6, 8);
      const mat = new THREE.MeshPhongMaterial({ color:0x94a3b8, emissive:0x4a9eff, emissiveIntensity:0.1, shininess:20 });
      const brow = new THREE.Mesh(geo, mat);
      brow.position.set(xOff, 0.40, 0.73);
      brow.rotation.z = xOff < 0 ? 0.12 : -0.12;
      return brow;
    }
    const browL = makeBrow(-0.28);
    const browR = makeBrow(0.28);
    faceGroup.add(browL);
    faceGroup.add(browR);

    // Mouth — built from a curved tube
    function buildMouth(openAmount) {
      if (head.userData.mouthMesh) faceGroup.remove(head.userData.mouthMesh);
      const pts = [];
      const segs = 20;
      for(let i=0;i<=segs;i++) {
        const t = i/segs;
        const x = (t-0.5)*0.38;
        const yBase = -0.22;
        const yCurve = Math.sin(t*Math.PI)*0.06;
        const yOpen = (t>0.2 && t<0.8) ? -openAmount*0.08 : 0;
        pts.push(new THREE.Vector3(x, yBase - yCurve + yOpen, 0.77));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.018, 6, false);
      const tubeMat = new THREE.MeshPhongMaterial({ color:0x94a3b8, emissive:0x4a9eff, emissiveIntensity:0.15, shininess:40 });
      const tube = new THREE.Mesh(tubeGeo, tubeMat);
      faceGroup.add(tube);
      head.userData.mouthMesh = tube;
      return tube;

      pPositions[i*3+2] = r*Math.cos(phi)*0.82;

      document.getElementById('orb-state-text').textContent = s;

      const expressions = {
        idle:     {lidOpen:1.0, browAngle:0.12, mouthOpen:0},
        active:   {lidOpen:1.18, browAngle:0.05, mouthOpen:0},
        speaking: {lidOpen:1.12, browAngle:0.08, mouthOpen:0.6},
        alert:    {lidOpen:0.82, browAngle:-0.22, mouthOpen:0},
        dark:     {lidOpen:0.42, browAngle:0.08, mouthOpen:0},
      };
      const ex = expressions[s];
      [eyeL, eyeR].forEach(eye => { eye.userData.targetLid = ex.lidOpen; });
      browL.userData.targetAngle = ex.browAngle;
      browR.userData.targetAngle = -ex.browAngle;
      browL.userData.alertAsymmetry = (s==='alert') ? 0.08 : 0;
      head.userData.targetMouth = ex.mouthOpen;
      if(s==='speaking') fireSpeakRings();
    }
    
    function fireSpeakRings() {
      speakRings.forEach((r,i) => {
        setTimeout(()=>{
          r.userData.active = true;
          r.userData.progress = 0;
          r.scale.set(1,1,1);
          r.material.opacity = 0.5;
        }, i*280);
      });
    }
    
    // Clock
    let t = 0;
    let blinkTimer = 0;
    let alertPulse = 0;
    let speakMorphT = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;
      blinkTimer += 0.016;
      alertPulse += 0.04;
    
      const st = STATE.orbState;
      const cfg = ORB_COLORS[st] || ORB_COLORS.idle;
    
      // Breathing scale
      let breathFreq = st==='active'?2.0 : st==='dark'?0.125 : st==='alert'?1.8 : 1.0;
      let breathAmp  = st==='dark'?0.005 : st==='alert'?0.025 : 0.015;
      const breath = 1 + Math.sin(t*breathFreq)*breathAmp;
      let alertShake = 0;
      if(st==='alert') alertShake = Math.sin(alertPulse)*0.004;
      faceGroup.scale.set(breath+alertShake, breath, breath);
      faceGroup.rotation.y = Math.sin(t*0.3)*0.05;
    
      // Color lerp
      headMat.emissive.lerp(new THREE.Color(cfg.head), 0.04);
      headMat.emissiveIntensity += (cfg.emissive - headMat.emissiveIntensity)*0.04;
      glowMat.color.lerp(new THREE.Color(cfg.head), 0.04);
      glowMat.opacity += (cfg.glow - glowMat.opacity)*0.04;
      ringMat.color.lerp(new THREE.Color(cfg.ring), 0.04);
      ringMat.opacity += (cfg.ringOp - ringMat.opacity)*0.04;
      mainLight.color.lerp(new THREE.Color(cfg.head), 0.04);
      mainLight.intensity = st==='speaking'?3.0 : st==='dark'?0.5 : 2.5;
    
      // Alert red pulse on ring
      if(st==='alert') ringMat.opacity = cfg.ringOp + Math.sin(alertPulse*2)*0.15;
    
      ring.rotation.z += 0.006;
      ring.rotation.x = Math.sin(t*0.2)*0.1;
    
      // Particles
      particles.visible = STATE.mode==='full';
      if(particles.visible) {
        particles.rotation.y += 0.003;
        particles.rotation.x = Math.sin(t*0.1)*0.05;
        pMat.opacity = 0.4 + Math.sin(t*1.5)*0.15;
      }
    
      // Eye blink
      if(blinkTimer > 3.5 + Math.random()*2) {
        blinkTimer = 0;
        animateBlink();
      }
    
      // Eyelid open amount
      [eyeL, eyeR].forEach(eye => {
        const target = eye.userData.targetLid || 1.0;
        const current = eye.userData.currentLid || 1.0;
        eye.userData.currentLid = current + (target-current)*0.08;
        eye.userData.lid.scale.y = eye.userData.currentLid;
        eye.userData.lid.position.y = 0.145*(1-eye.userData.currentLid)*0.5;
      });
    
      // Brow animation
      [browL, browR].forEach((brow, i) => {
        const target = (i===0 ? browL.userData.targetAngle : browR.userData.targetAngle) || (i===0?0.12:-0.12);
        brow.rotation.z += (target - brow.rotation.z)*0.06;
        if(STATE.orbState==='alert' && i===0) brow.position.y = 0.40 + Math.sin(alertPulse*0.7)*0.008;
      });
    
      // Mouth morph
      if(head.userData.targetMouth !== head.userData.currentMouth) {
        head.userData.currentMouth = (head.userData.currentMouth||0) + ((head.userData.targetMouth||0) - (head.userData.currentMouth||0))*0.06;
        if(Math.abs(head.userData.targetMouth - head.userData.currentMouth) < 0.01) head.userData.currentMouth = head.userData.targetMouth;
        buildMouth(head.userData.currentMouth);
        // Lip sync wobble when speaking
        if(STATE.isSpeaking) {
          speakMorphT += 0.12;
          const wobble = 0.4 + Math.sin(speakMorphT)*0.3 + Math.random()*0.1;
          buildMouth(wobble);
        }
      }
    
      // Speaking rings
      speakRings.forEach(r => {
        if(r.userData.active) {
          r.userData.progress += 0.018;
          const p = r.userData.progress;
          r.scale.set(1+p*0.8, 1+p*0.8, 1+p*0.8);
          r.material.opacity = Math.max(0, 0.5*(1-p));
          if(p>=1) { r.userData.active=false; r.material.opacity=0; }
        }
      });
    
      renderer.render(scene, camera);
    }
    animate();
    
    function animateBlink() {
      let frame = 0;
      const b = setInterval(()=>{
        frame++;
        const close = frame<=3 ? frame/3 : (6-frame)/3;
        [eyeL,eyeR].forEach(e=>{
          const lid = e.userData.targetLid||1;
          e.userData.currentLid = lid * Math.max(0.1, close);
        });
        if(frame>=6) clearInterval(b);
      },40);
    }

      const url = document.getElementById('skill-url').value.trim();
      if(!url) return;
      MOCK.skills.push({name:url.split('/').pop()||url, mode:'dormant', lastRun:'never', success:'—', cost:'?', health:'green'});
      renderSkills();
      document.getElementById('skill-url').value='';
    };
    
    window.addMCPServer = function() {
      const name = prompt('MCP server name or URL:');
      if(name) {
        MOCK.mcpServers.push({id:'mcp'+Date.now(),name,status:'connected',tools:['list'],calls:0,latency:'—'});
        renderMCP();
      }
    };
    
    // ═══════════════════════════════════════════════
    // SPEECH
    // ═══════════════════════════════════════════════
    function orbSpeak(text) {
      if(STATE.mode==='dark') return;
      if(STATE.speechQueue.length >= 3) STATE.speechQueue.shift(); // drop oldest
      STATE.speechQueue.push(text);
      if(!STATE.isSpeaking) processQueue();
    }
    
    function processQueue() {
      if(STATE.speechQueue.length===0) {
        STATE.isSpeaking=false;
        setOrbState('idle');
        return;
      }
      const text = STATE.speechQueue.shift();
      STATE.isSpeaking=true;
      setOrbState('speaking');
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate=0.95; utter.pitch=0.9; utter.volume=0.85;
      const voices = STATE.speechSynth.getVoices();
      const neural = voices.find(v=>v.name.includes('Neural')||v.name.includes('Natural')||v.localService===false);
      if(neural) utter.voice=neural;
      utter.onend=()=>{ STATE.currentUtterance=null; processQueue(); };
      STATE.currentUtterance=utter;
      STATE.speechSynth.speak(utter);
      STATE.lastOrbSpoke=Date.now();
    }
    
    // ═══════════════════════════════════════════════
    // PROACTIVE SPEECH EVALUATOR
    // ═══════════════════════════════════════════════
    function evaluateTriggers() {
      if(STATE.mode==='dark') return;
      const now = Date.now();
      if((now - STATE.lastOrbSpoke) < 20*60*1000 && STATE.lastOrbSpoke > 0) return;
      if((now - STATE.lastUserSpoke) < 10*60*1000 && STATE.lastUserSpoke > 0) return;
      const h = new Date().getHours();
      if(h >= 23 || h < 7) return; // quiet hours
      const phrase = MOCK.proactivePhrases[Math.floor(Math.random()*MOCK.proactivePhrases.length)];
      orbSpeak(phrase);
    }
    
    // ═══════════════════════════════════════════════
    // MOCK SSE — fires every 15s
    // ═══════════════════════════════════════════════
    function mockSSETick() {
      const events = [
        ()=>{ MOCK.messages.push({from:'NanoClaw',type:'agent',text:'Graph traversal complete. 12 new dependency edges mapped.',time:'now',color:'#7c3aed',init:'NC'}); renderMsgBus(); },
        ()=>{ MOCK.projects[0].updates.unshift({agent:'Weaver',text:'auth_flow compiled. Blake3: d9e2f1a4.',time:'now',tools:['skill_compile']}); renderStream(); setOrbState('active'); setTimeout(()=>setOrbState('idle'),3000); },
        ()=>{ MOCK.health.unshift({icon:'🟡',text:'anthropic SDK 2.1 behind declared requirement 2.3',proj:'HyperForge'}); renderHealth(); setOrbState('alert'); setTimeout(()=>setOrbState('idle'),4000); },
        ()=>{ MOCK.agents[0].tokens += 1247; renderAgents(); },
        ()=>{ orbSpeak(MOCK.proactivePhrases[Math.floor(Math.random()*MOCK.proactivePhrases.length)]); },
      ];
      const fn = events[Math.floor(Math.random()*events.length)];
      fn();
    }
    
    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US',{hour12:false});
    }
    
    // ═══════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════
    renderStream();
    renderKanban();
    renderMCP();
    renderCRM();
    renderSkills();
    renderAgents();
    renderHealth();
    renderPrefs();
    renderMsgBus();
    updateClock();
    
    setInterval(updateClock, 1000);
    setInterval(mockSSETick, 15000); // 15s SSE mock
    setInterval(evaluateTriggers, 30000); // 30s proactive
    setTimeout(()=>{ orbSpeak("HyperForge dependency shifted. NanoClaw is rebuilding the graph."); }, 3000);
    setOrbState('active');
    setTimeout(()=>setOrbState('idle'),4000);
    
    // Try real SSE
    try {
      const sse = new EventSource('http://localhost:8080/stream/mock-session');
      sse.onopen = ()=>{
        document.getElementById('mock-badge').style.display='none';
        document.getElementById('conn-dot').classList.remove('mock');
      };
      sse.onerror = ()=>{};
    } catch(e){}
    
    console.log('%cAPEX STUDIO V3 — SNOWBALL COMMAND CENTER', 'color:#4a9eff;font-size:14px;font-weight:700;');
    console.log('%cMCP + Kanban + CRM + Stream + 3D Face Avatar', 'color:#94a3b8;');
    </script>
